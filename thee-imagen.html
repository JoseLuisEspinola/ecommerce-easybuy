<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Three.js - Imagen y Producto 3D EasyBuy</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #12131C;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(18, 19, 28, 0.85);
            backdrop-filter: blur(8px);
            padding: 16px 22px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            max-width: 320px;
        }

        #info h3 {
            margin: 0 0 8px 0;
            color: #00d2ff;
            font-size: 1.2rem;
        }

        #info p {
            margin: 0;
            color: #cccccc;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="info">
        <h3>Tarjeta 3D con Imagen</h3>
        <p>Arrastra con el mouse para rotar la tarjeta, usa la rueda para hacer zoom o clic derecho para desplazar.</p>
    </div>

    <!-- Scripts de Three.js y OrbitControls compatibles con carga local file:// -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Escena
        const scene = new THREE.Scene();

        // 2. Cámara
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4.5);

        // 3. Renderizador
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x12131C);
        document.body.appendChild(renderer.domElement);

        // 4. Controles de órbita (interactividad con mouse)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 5. Iluminación profesional (Ambiental + Luces de punto con color)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(5, 5, 5);
        scene.add(mainLight);

        const blueLight = new THREE.PointLight(0x00d2ff, 1.5, 10);
        blueLight.position.set(-4, -2, 2);
        scene.add(blueLight);

        const purpleLight = new THREE.PointLight(0x9d00ff, 1.5, 10);
        purpleLight.position.set(4, 2, -2);
        scene.add(purpleLight);

        // 6. Carga de la Imagen local (img/E-commerce.jpg)
        const textureLoader = new THREE.TextureLoader();
        
        // Creamos una textura de respaldo (canvas) en caso de tardar en cargar
        function createFallbackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, 512, 512);
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('EASYBUY 3D', 256, 256);
            return new THREE.CanvasTexture(canvas);
        }

        const imageTexture = textureLoader.load(
            'img/E-commerce.jpg',
            // Al completar la carga:
            function (texture) {
                console.log('Imagen de producto cargada con éxito.');
            },
            undefined,
            // Si hay algún error con la ruta de la imagen:
            function (err) {
                console.warn('Usando textura de respaldo por error en la ruta.');
            }
        );

        // 7. Crear la Tarjeta 3D (Geometría de caja con bordes redondeados estilizados)
        const geometry = new THREE.BoxGeometry(3.2, 2.2, 0.15);

        // Materiales para las 6 caras del cubo/tarjeta
        const sideMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x1e2235, 
            roughness: 0.3,
            metalness: 0.8 
        });
        
        const frontMaterial = new THREE.MeshStandardMaterial({ 
            map: imageTexture,
            roughness: 0.2,
            metalness: 0.1
        });

        const backMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x0f111a,
            roughness: 0.4
        });

        const materials = [
            sideMaterial,  // Derecha
            sideMaterial,  // Izquierda
            sideMaterial,  // Arriba
            sideMaterial,  // Abajo
            frontMaterial, // Cara Frontal con la IMAGEN
            backMaterial   // Cara Trasera
        ];

        const card3D = new THREE.Mesh(geometry, materials);
        scene.add(card3D);

        // 8. Bucle de Animación con rotación suave
        function animate() {
            requestAnimationFrame(animate);

            // Rotación automática ligera
            card3D.rotation.y += 0.005;

            // Actualizar controles de mouse
            controls.update();

            // Renderizar la escena
            renderer.render(scene, camera);
        }
        animate();

        // 9. Adaptar el renderizado al cambiar el tamaño de la ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
