<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Three.js - Texto en 3D (2 Métodos)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="info">
        <h2>Three.js con Texto</h2>
        <p><strong>Izquierda:</strong> Texto 3D extruido volumétrico (FontLoader + TextGeometry)<br>
            <strong>Derecha:</strong> Cartel 3D interactivo (Canvas2D + CanvasTexture)
        </p>
    </div>

    <!-- Three.js + OrbitControls + FontLoader + TextGeometry (v0.128.0) -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

    <script>
        // Escena, cámara y renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x181818);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0x00ffff, 1);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0xff00ff, 1);
        pointLight.position.set(-5, -5, 5);
        scene.add(pointLight);

        // ===============================================
        // MÉTODO 1: Texto dibujado en Canvas 2D + CanvasTexture (Rápido y adaptable)
        // ===============================================
        function createTextTexture(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Fondo degradado
            const gradient = ctx.createLinearGradient(0, 0, 512, 256);
            gradient.addColorStop(0, '#1e3c72');
            gradient.addColorStop(1, '#2a5298');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Borde
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, canvas.width - 10, canvas.height - 10);

            // Texto
            ctx.font = 'Bold 48px sans-serif';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 10;
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);

            return new THREE.CanvasTexture(canvas);
        }

        // Cartel 3D con textura de texto
        const canvasTexture = createTextTexture("EASY BUY 3D");
        const signGeometry = new THREE.BoxGeometry(3, 1.5, 0.2);
        const signMaterial = new THREE.MeshStandardMaterial({ map: canvasTexture, roughness: 0.3 });
        const signMesh = new THREE.Mesh(signGeometry, signMaterial);
        signMesh.position.set(2, 0, 0);
        scene.add(signMesh);

        // ===============================================
        // MÉTODO 2: Texto 3D Volumétrico (TextGeometry + FontLoader)
        // ===============================================
        let textMesh3D;
        const fontLoader = new THREE.FontLoader();
        fontLoader.load('https://unpkg.com/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json', (font) => {
            const textGeo = new THREE.TextGeometry('EASYBUY', {
                font: font,
                size: 0.7,
                height: 0.2, // Grosor 3D
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.03,
                bevelSize: 0.02,
                bevelSegments: 5
            });

            textGeo.center(); // Centrar origen del objeto

            const textMat = new THREE.MeshStandardMaterial({
                color: 0x00ff88,
                metalness: 0.6,
                roughness: 0.2
            });

            textMesh3D = new THREE.Mesh(textGeo, textMat);
            textMesh3D.position.set(-2, 0, 0);
            scene.add(textMesh3D);
        });

        // Bucle de animación
        function animate() {
            requestAnimationFrame(animate);
            signMesh.rotation.y += 0.01;
            if (textMesh3D) {
                textMesh3D.rotation.y += 0.01;
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
