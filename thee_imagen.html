<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Three.js - Objeto 3D con Textura de Imagen</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121212;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 20px;
            border-radius: 8px;
            pointer-events: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="info">
        <h2>Three.js con Textura de Imagen</h2>
        <p>Arrastra con el mouse para rotar la tarjeta 3D y usa la rueda para hacer zoom.</p>
    </div>

    <!-- Three.js + OrbitControls (v0.128.0) -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Escena, Cámara y Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x181818);
        document.body.appendChild(renderer.domElement);

        // 2. Controles de órbita
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // 4. Cargar Imagen como Textura (TextureLoader)
        const textureLoader = new THREE.TextureLoader();
        const texture = textureLoader.load('img/E-commerce.jpg');

        // 5. Creación de una tarjeta 3D con la imagen cargada
        const geometry = new THREE.BoxGeometry(3, 2, 0.1); // Ancho: 3, Alto: 2, Grosor: 0.1
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0x333333 }), // Lado derecho
            new THREE.MeshStandardMaterial({ color: 0x333333 }), // Lado izquierdo
            new THREE.MeshStandardMaterial({ color: 0x333333 }), // Lado superior
            new THREE.MeshStandardMaterial({ color: 0x333333 }), // Lado inferior
            new THREE.MeshStandardMaterial({ map: texture }),     // Cara frontal (con la imagen!)
            new THREE.MeshStandardMaterial({ color: 0x222222 })  // Cara trasera
        ];

        const card = new THREE.Mesh(geometry, materials);
        scene.add(card);

        // 6. Bucle de Animación
        function animate() {
            requestAnimationFrame(animate);
            card.rotation.y += 0.005; // Rotación suave automática
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 7. Responsive
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
