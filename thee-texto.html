<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Three.js Texto EASYBUY</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #202020;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 18px;
            border-radius: 8px;
            pointer-events: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div id="info">
        <h3>Texto 3D - EASYBUY</h3>
        <p>Arrastra con el mouse para rotar el texto 3D.</p>
    </div>

    <!-- Carga tradicional sin problemas de CORS al abrir directamente el archivo HTML -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. Escena
        const scene = new THREE.Scene();

        // 2. Cámara
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 5);

        // 3. Renderizador
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x202020);
        document.body.appendChild(renderer.domElement);

        // 4. Controles de órbita
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 5. Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00ffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xff00ff, 1);
        pointLight.position.set(-5, -5, 5);
        scene.add(pointLight);

        // 6. Cargar Fuente y Crear Texto 3D
        let textMesh;
        const fontLoader = new THREE.FontLoader();
        fontLoader.load("https://unpkg.com/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json", (font) => {
            const geometry = new THREE.TextGeometry("EASYBUY", {
                font: font,
                size: 0.8,
                height: 0.25, // Grosor 3D
                curveSegments: 12,
                bevelEnabled: true,
                bevelThickness: 0.03,
                bevelSize: 0.02,
                bevelSegments: 5
            });

            // Centramos el texto en el origen (0,0,0)
            geometry.center();

            const material = new THREE.MeshStandardMaterial({
                color: 0x00ff88,
                roughness: 0.2,
                metalness: 0.5
            });

            textMesh = new THREE.Mesh(geometry, material);
            scene.add(textMesh);
        });

        // 7. Bucle de Animación
        function animate() {
            requestAnimationFrame(animate);
            if (textMesh) {
                textMesh.rotation.y += 0.01; // Hace rotar el texto suavemente
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. Redimensionar ventana
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
